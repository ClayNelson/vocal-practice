name: VocalPractice
options:
  bundleIdPrefix: com.claynelson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: FP8F8A7LL3
    CODE_SIGN_STYLE: Automatic
targets:
  VocalPractice:
    type: application
    platform: iOS
    sources: [VocalPractice]
    info:
      path: VocalPractice/Info.plist
      properties:
        CFBundleDisplayName: Vocal Practice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Records a take of each warmup and song so you can hear your progress.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claynelson.vocalpractice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  VocalPracticeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VocalPractice
schemes:
  VocalPractice:
    build:
      targets:
        VocalPractice: all
    test:
      targets: [VocalPracticeTests]
